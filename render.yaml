# Render Blueprint Specification for BlackBox
# https://render.com/docs/blueprint-spec

services:
  # ── BlackBox FastAPI Backend API Web Service ───────────────────────────
  - type: web
    name: blackbox-api
    runtime: python
    rootDir: backend
    plan: free
    region: oregon # or frankfurt, ohio, singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://*.vercel.app"
      - key: DATABASE_URL
        sync: false # Set to your Neon PostgreSQL connection string (postgresql+asyncpg://...)
      - key: STORAGE_BACKEND
        value: local # Change to 'r2' if using Cloudflare R2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: REDIS_URL
        sync: false # Set to Upstash Redis string (rediss://...) if using worker
      - key: NEBIUS_API_KEY
        sync: false # Nebius Token Factory inference key
      - key: NEBIUS_BASE_URL
        value: https://api.studio.nebius.ai/v1
      - key: NEBIUS_MODEL
        value: meta-llama/Meta-Llama-3.1-70B-Instruct
