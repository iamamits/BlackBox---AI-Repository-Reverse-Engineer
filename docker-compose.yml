services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackbox-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./blackbox.db}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-nvidia/Nemotron-3-Ultra-550b-a55b}
    volumes:
      - ./backend/app:/app/app
      - backend-workspace:/app/workspace_data
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: blackbox-worker
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./blackbox.db}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-nvidia/Nemotron-3-Ultra-550b-a55b}
    volumes:
      - ./backend/app:/app/app
      - backend-workspace:/app/workspace_data
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blackbox-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-workspace:
  backend-db:
